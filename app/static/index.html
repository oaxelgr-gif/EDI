<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0713">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>EDI</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="EDI">
  <script>
    // Aplica el tema guardado antes de pintar (evita el parpadeo)
    try { const t = localStorage.getItem("edi.theme"); if (t && t !== '"auto"') document.documentElement.dataset.theme = JSON.parse(t); } catch {}
  </script>
  <script src="/static/js/look.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/shell.css">
  <link rel="stylesheet" href="/static/css/chat.css">
  <link rel="stylesheet" href="/static/css/views.css">
</head>
<body>
  <div class="shell" id="shell">
    <aside class="drawer glass" id="drawer" aria-label="Menú">
      <div class="drawer-head">
        <span class="mark" aria-hidden="true"></span>
        <span class="wordmark">EDI</span>
        <button class="icon-btn drawer-close" data-action="close-drawer" aria-label="Cerrar menú"></button>
      </div>
      <button class="btn btn-primary new-chat" data-action="new-chat"></button>
      <nav class="drawer-nav" aria-label="Secciones">
        <a href="#/tasks" data-nav="tasks"><span data-icon="list"></span>Pendientes<span class="count" id="countTasks"></span></a>
        <a href="#/memory" data-nav="memory"><span data-icon="brain"></span>Memoria</a>
        <a href="#/mail" data-nav="mail"><span data-icon="mail"></span>Correo<span class="count" id="countMail"></span></a>
        <a href="#/whatsapp" data-nav="whatsapp"><span data-icon="chat"></span>WhatsApp<span class="count" id="countWa"></span></a>
        <a href="#/settings" data-nav="settings"><span data-icon="gear"></span>Ajustes</a>
        <a href="#/guide" data-nav="guide"><span data-icon="help"></span>Guía de uso</a>
      </nav>
      <div class="drawer-section-title">Conversaciones</div>
      <ul class="session-list" id="sessionList"></ul>
      <div class="drawer-foot"><span data-icon="phone"></span><a class="lan" id="lanLink" href="#/settings/devices">Usar en otro dispositivo</a></div>
    </aside>
    <div class="scrim" data-action="close-drawer"></div>

    <div class="stage">
      <header class="topbar">
        <button class="icon-btn" data-action="toggle-drawer" aria-label="Abrir menú" data-icon="menu"></button>
        <div class="topbar-title" id="topTitle">EDI</div>
        <button class="icon-btn" id="themeBtn" aria-label="Cambiar tema" title="Tema"></button>
        <div class="status glass" id="status" title="Estado"><span class="status-dot"></span><span class="status-text">conectando</span></div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
