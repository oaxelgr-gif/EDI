<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0713">
  <title>EDI · Entrar</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <style>
    body { display: grid; place-items: center; min-height: 100dvh; padding: 20px; }
    form { width: min(100%, 360px); border-radius: var(--r-lg); padding: 30px 26px; display: grid; gap: 16px; text-align: center; }
    .logo { width: 64px; height: 64px; margin: 0 auto; }
    h1 { font-size: var(--fs-2xl); }
    p { margin: 0; color: var(--text-2); font-size: var(--fs-sm); }
    .pin-input { text-align: center; font-size: 1.8rem; letter-spacing: .5em; padding: 12px 0 12px .5em; font-variant-numeric: tabular-nums; }
    .err { color: var(--alert); min-height: 20px; font-size: var(--fs-sm); }
  </style>
  <script src="/static/js/look.js"></script>
</head>
<body>
  <form class="glass" id="f">
    <img class="logo" src="/static/icon.svg" alt="">
    <h1>Entrar a EDI</h1>
    <p>Escribe el PIN que aparece en tu Mac, en Ajustes → Dispositivos.</p>
    <input class="input pin-input" name="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" required autofocus aria-label="PIN">
    <button class="btn btn-primary">Entrar</button>
    <div class="err" id="err" aria-live="polite"></div>
  </form>
  <script>
    const f = document.getElementById("f"), err = document.getElementById("err"), btn = f.querySelector("button");
    let timer = null;
    // Después de 5 intentos fallidos EDI pide esperar 5 minutos: cuenta regresiva y botón desactivado
    function lock(sec) {
      clearInterval(timer);
      const tick = () => {
        if (sec <= 0) { clearInterval(timer); btn.disabled = false; f.pin.disabled = false; err.textContent = "Ya puedes intentar de nuevo."; f.pin.focus(); return; }
        btn.disabled = true; f.pin.disabled = true;
        const m = Math.floor(sec / 60), s = String(sec % 60).padStart(2, "0");
        err.textContent = `Demasiados intentos. Espera ${m}:${s} para volver a intentar.`;
        sec--;
      };
      tick(); timer = setInterval(tick, 1000);
    }
    fetch("/api/login/state").then((r) => r.json()).then((s) => { if (s.wait) lock(s.wait); }).catch(() => {});
    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      try {
        const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin: f.pin.value }) });
        if (r.ok) { location.href = "/"; return; }
        const j = await r.json().catch(() => ({}));
        if (j.wait) { lock(j.wait); return; }
        err.textContent = j.detail || "PIN incorrecto. Revísalo en tu Mac.";
        f.pin.select();
      } catch { err.textContent = "No hay conexión con EDI. ¿Está encendido en tu Mac?"; }
      btn.disabled = false;
    });
  </script>
</body>
</html>
