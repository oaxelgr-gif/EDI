<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0713">
  <title>EDI · Entrar</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <style>
    body { display: grid; place-items: center; min-height: 100dvh; padding: 20px; }
    form { width: min(100%, 360px); border-radius: var(--r-lg); padding: 30px 26px; display: grid; gap: 16px; text-align: center; }
    .logo { width: 64px; height: 64px; margin: 0 auto; }
    h1 { font-size: var(--fs-2xl); }
    p { margin: 0; color: var(--text-2); font-size: var(--fs-sm); }
    .pin-input { text-align: center; font-size: 1.8rem; letter-spacing: .5em; padding: 12px 0 12px .5em; font-variant-numeric: tabular-nums; }
    .err { color: var(--alert); min-height: 20px; font-size: var(--fs-sm); }
  </style>
  <script src="/static/js/look.js"></script>
</head>
<body>
  <form class="glass" id="f">
    <img class="logo" src="/static/icon.svg" alt="">
    <h1>Entrar a EDI</h1>
    <p>Escribe el PIN que aparece en tu Mac, en Ajustes → Dispositivos.</p>
    <input class="input pin-input" name="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" required autofocus aria-label="PIN">
    <button class="btn btn-primary">Entrar</button>
    <div class="err" id="err" aria-live="polite"></div>
  </form>
  <script>
    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin: e.target.pin.value }) });
      if (r.ok) location.href = "/"; else { document.getElementById("err").textContent = "PIN incorrecto. Revísalo en tu Mac."; e.target.pin.select(); }
    });
  </script>
</body>
</html>
