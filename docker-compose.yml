services:
  edi:
    build:
      context: .
      args:
        WITH_WHISPER: ${WITH_WHISPER:-false}
    image: edi:latest
    container_name: edi
    env_file: .env
    environment:
      - EDI_DATA_DIR=/data
      - EDI_CONFIG_DIR=/config
    volumes:
      - ./data:/data              # memoria, tareas, tokens (persisten al apagar)
      - ./config:/config:ro       # cuentas de correo
    ports:
      - "127.0.0.1:8765:8000"     # sólo accesible desde tu Mac
    restart: "no"                 # se enciende con el acceso directo, no al arrancar la Mac
    mem_limit: 512m
    cpus: 1.0
