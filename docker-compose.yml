services:
  edi:
    build:
      context: .
      args:
        WITH_WHISPER: ${WITH_WHISPER:-false}
    image: edi:latest
    container_name: edi
    env_file: .env
    environment:
      - EDI_DATA_DIR=/data
      - EDI_CONFIG_DIR=/config
      - EDI_LAN_HOST=${EDI_LAN_HOST:-}
      - EDI_WHATSAPP_URL=http://whatsapp:3000
    volumes:
      - ./data:/data              # memoria, tareas, certificados (persisten al apagar)
      - ./config:/config:ro
    ports:
      - "127.0.0.1:8765:8000"     # tu Mac: http://localhost:8765
      - "8766:8443"               # tu red: https://IP-de-tu-Mac:8766 (pide PIN)
    restart: "no"
    mem_limit: 512m
    cpus: 1.0

  # Puente WhatsApp (dispositivo vinculado). Sin puertos publicados: sólo EDI lo usa.
  whatsapp:
    build: ./whatsapp
    image: edi-whatsapp:latest
    container_name: edi-whatsapp
    volumes:
      - ./data/whatsapp:/auth     # sesión vinculada y mensajes recientes
    restart: "no"
    mem_limit: 256m
    cpus: 0.5
